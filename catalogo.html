<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo de gorras – WinCaps</title>
<meta name="description" content="Todas las gorras WinCaps: filtra por tipo, material y color. Consulta por WhatsApp.">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;900&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="index.html">
      <img src="img/logo.png" alt="" width="52" height="52" onerror="this.style.display='none'">
      <span><b>WinCaps</b><small>Born To Win</small></span>
    </a>
    <button class="burger" aria-label="Abrir menú" aria-expanded="false">☰</button>
    <nav id="nav">
      <a href="index.html">Inicio</a><a href="catalogo.html">Catálogo</a><a href="index.html#nosotros">Nosotros</a><a href="index.html#contacto">Contacto</a>
    </nav>
  </div>
</header>

<main>
  <section class="sec">
    <div class="wrap catalog-layout">
      <aside class="filters">
        <div class="filters-head">
          <h2>Filtros</h2>
          <button id="limpiar" class="link">Limpiar</button>
        </div>
        <input id="q" type="search" placeholder="Buscar una gorra" aria-label="Buscar una gorra">

        <div class="filter-group">
          <h3>Tipo</h3>
          <div id="f-tipo" class="chip-list"></div>
        </div>
        <div class="filter-group">
          <h3>Material</h3>
          <div id="f-material" class="chip-list"></div>
        </div>
        <div class="filter-group">
          <h3>Color</h3>
          <div id="f-color" class="chip-list"></div>
        </div>
      </aside>

      <div class="catalog-main">
        <h1>Catálogo</h1>
        <p id="count" aria-live="polite"></p>
        <div id="grid" class="grid"></div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div><a data-wa target="_blank" rel="noopener" href="#">WhatsApp</a><a data-fb target="_blank" rel="noopener" href="#">Facebook</a></div>
    <div><a href="index.html#contacto">Contacto</a><a href="privacidad.html" target="_blank" rel="noopener">Política de privacidad</a></div>
    <div>© <span id="year"></span> WinCaps</div>
  </div>
</footer>

<a class="float" data-wa target="_blank" rel="noopener" href="#" aria-label="Escríbenos por WhatsApp">WhatsApp</a>

<dialog id="modal" aria-label="Detalle de la gorra">
  <button class="close" aria-label="Cerrar">×</button>
  <div id="modal-body"></div>
</dialog>

<script src="js/productos.js"></script>
<script src="js/common.js"></script>
<script src="js/catalogo.js"></script>
</body>
</html>
